name: Build APK

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'tools/**']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK (cmdline-tools + licencias)
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Instalar plataforma Android 17 (API 37) y build-tools
        run: |
          set -e
          sdkmanager --list 2>/dev/null > /tmp/sdk.txt || true
          # Preferir versiones estables; usar beta/rc solo si no hay otra
          pick() { grep -o "$1" /tmp/sdk.txt | sort -uV > /tmp/all.txt; (grep -viE 'beta|rc|alpha|preview' /tmp/all.txt || cat /tmp/all.txt) | tail -n 1; }
          PLATFORM=$(pick 'platforms;android-37[^ |]*')
          BT=$(pick 'build-tools;37[^ |]*')
          echo "Plataforma: $PLATFORM / Build-tools: $BT"
          test -n "$PLATFORM" && test -n "$BT"
          sdkmanager "$PLATFORM" "$BT"

      - name: Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Pruebas unitarias + APK debug
        run: gradle --no-daemon --parallel --build-cache :app:testDebugUnitTest :app:assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: smartkeyboard-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publicar informes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
