name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK (cmdline-tools + licencias)
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Instalar plataforma Android 17 (API 37) y build-tools
        run: |
          set -e
          sdkmanager --list 2>/dev/null | grep -o 'platforms;android-37[^ |]*' | sort -uV | tail -n 1 > /tmp/platform.txt
          sdkmanager --list 2>/dev/null | grep -o 'build-tools;37[^ |]*' | sort -uV | tail -n 1 > /tmp/bt.txt
          cat /tmp/platform.txt /tmp/bt.txt
          test -s /tmp/platform.txt && test -s /tmp/bt.txt
          sdkmanager "$(cat /tmp/platform.txt)" "$(cat /tmp/bt.txt)"

      - name: Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Pruebas unitarias
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Compilar APK debug
        run: gradle --no-daemon :app:assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: smartkeyboard-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publicar informes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
